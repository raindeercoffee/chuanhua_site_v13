# 自動產生網址頁：有人改了 index.html 送上來，就自動跑 tools/build_routes.py，
# 把各網址頁（/about/、/quiz/…）、404.html、sitemap.xml 一起更新，不用任何人記得。
name: 自動產生網址頁

on:
  push:
    branches: [master]
    paths:
      - index.html
      - tools/build_routes.py
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 產生網址頁
        run: python tools/build_routes.py
      - name: 有變動才存回去
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "網址頁已經是最新的"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "自動重新產生網址頁"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 請 GitHub 重新發布網站
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
