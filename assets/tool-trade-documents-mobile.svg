<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
<title id="title">國貿文件整理手機示意</title>
<desc id="desc">虛構國貿文件整理流程：提單和裝箱單轉成核對表，櫃號、箱數待人工確認。</desc>
<defs>
  <linearGradient id="bg" x2=".9" y2="1"><stop stop-color="#e4edf2"/><stop offset="1" stop-color="#f5e9e9"/></linearGradient>
  <filter id="shadow" x="-25%" y="-20%" width="150%" height="150%"><feDropShadow dy="10" stdDeviation="12" flood-color="#5c7585" flood-opacity=".15"/></filter>
</defs>
<rect width="600" height="800" fill="url(#bg)"/>
<rect x="30" y="32" width="540" height="736" rx="26" fill="#fff" filter="url(#shadow)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#345363">
  <text x="66" y="107" font-size="43" font-weight="700">國貿文件整理</text>
  <text x="66" y="156" font-size="30" fill="#627788">指定欄位／人工核對</text>
</g>
<rect x="66" y="205" width="218" height="118" rx="19" fill="#eef3f7"/>
<rect x="316" y="205" width="218" height="118" rx="19" fill="#f4edf2"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="42" font-weight="600" fill="#3a596a" text-anchor="middle">
  <text x="175" y="280">提單</text><text x="425" y="280">裝箱單</text>
</g>
<path d="M300 354V410m-19 -19 19 19 19 -19" stroke="#a47a86" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="66" y="439" width="468" height="196" rx="20" fill="#eef4f6"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <text x="92" y="492" font-size="37" font-weight="600" fill="#355866">核對資料</text>
  <text x="92" y="552" font-size="33" fill="#476774">櫃號</text><text x="512" y="552" text-anchor="end" font-size="33" fill="#a27472">待確認</text>
  <path d="M90 572H508" stroke="#d2e0e5" stroke-width="2"/>
  <text x="92" y="616" font-size="33" fill="#476774">箱數</text><text x="512" y="616" text-anchor="end" font-size="33" fill="#a27472">待確認</text>
</g>
<path d="M66 668H534" stroke="#dbe5e8" stroke-width="2"/>
<text x="66" y="718" fill="#71808b" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="29">示例資料 · 須人工確認</text>
</svg>