<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">國貿文件整理操作示意</title>
<desc id="desc">虛構資料：將提單及裝箱單的欄位整理成核對表，櫃號、箱數均需人工確認。</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e6edf1"/><stop offset="1" stop-color="#f3e8eb"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dy="12" stdDeviation="17" flood-color="#607788" flood-opacity=".15"/></filter>
</defs>
<rect width="900" height="600" fill="url(#bg)"/>
<rect x="55" y="48" width="790" height="505" rx="26" fill="#fff" filter="url(#shadow)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#385668">
  <text x="99" y="126" font-size="43" font-weight="700">文件整理 · 人工核對</text>
  <text x="99" y="174" font-size="29" fill="#657b89">來源文件 → 欄位核對表</text>
</g>
<rect x="99" y="218" width="231" height="79" rx="18" fill="#eef4f6"/>
<rect x="363" y="218" width="231" height="79" rx="18" fill="#f3edf2"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#385868" font-size="40" font-weight="600" text-anchor="middle">
  <text x="214" y="270">提單</text><text x="478" y="270">裝箱單</text>
</g>
<path d="M630 256h128m-31 -23 31 23 -31 23" stroke="#a77988" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#395b69">
  <text x="99" y="363" font-size="37" font-weight="700">核對資料</text>
  <rect x="99" y="381" width="700" height="63" rx="14" fill="#eef3f6"/>
  <rect x="99" y="454" width="700" height="63" rx="14" fill="#eef3f6"/>
  <text x="129" y="425" font-size="34">櫃號</text><text x="757" y="425" font-size="34" text-anchor="end" fill="#a67777">待確認</text>
  <text x="129" y="498" font-size="34">箱數</text><text x="757" y="498" font-size="34" text-anchor="end" fill="#a67777">待確認</text>
</g>
<text x="99" y="548" fill="#71818b" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22">所有資料均為虛構示例</text>
</svg>