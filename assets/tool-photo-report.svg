<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">驗貨報告操作示意</title>
<desc id="desc">虛構資料：本批判定待確認，抽樣20件，缺點分級為嚴重0、主要2、次要1，品質結果須由驗貨人員判讀。</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e6edf1"/><stop offset="1" stop-color="#f3e8eb"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dy="12" stdDeviation="17" flood-color="#607788" flood-opacity=".15"/></filter>
</defs>
<rect width="900" height="600" fill="url(#bg)"/>
<rect x="55" y="48" width="790" height="505" rx="26" fill="#fff" filter="url(#shadow)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#385668">
  <text x="99" y="126" font-size="43" font-weight="700">QC 驗貨報告</text>
  <text x="99" y="174" font-size="29" fill="#657b89">照片整理 · 人工判讀</text>
</g>
<rect x="99" y="221" width="374" height="240" rx="20" fill="#eff3f6"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <text x="131" y="271" fill="#677e8a" font-size="30">本批判定</text>
  <text x="131" y="351" fill="#966d60" font-size="61" font-weight="700">待確認</text>
  <text x="131" y="417" fill="#415f6d" font-size="31">抽樣 20 件</text>
</g>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#385868">
  <text x="518" y="266" font-size="32" font-weight="600">缺點分級</text>
  <rect x="515" y="292" width="285" height="61" rx="13" fill="#eef4f2"/>
  <text x="538" y="335">嚴重</text><text x="762" y="335" text-anchor="end" font-weight="700">0</text>
  <rect x="515" y="365" width="285" height="61" rx="13" fill="#f8ebeb"/>
  <text x="538" y="408">主要</text><text x="762" y="408" text-anchor="end" font-weight="700">2</text>
  <rect x="515" y="438" width="285" height="61" rx="13" fill="#f6f0e5"/>
  <text x="538" y="480">次要</text><text x="762" y="480" text-anchor="end" font-weight="700">1</text>
</g>
<text x="99" y="521" fill="#71818b" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="23">所有資料均為虛構示例</text>
</svg>