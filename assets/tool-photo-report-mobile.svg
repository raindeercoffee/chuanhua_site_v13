<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
<title id="title">驗貨報告工具手機示意</title>
<desc id="desc">虛構的驗貨報告：抽樣20件，缺點分級嚴重0、主要2、次要1，由驗貨人員判定為待確認。</desc>
<defs>
  <linearGradient id="bg" x2=".9" y2="1"><stop stop-color="#e4edf2"/><stop offset="1" stop-color="#f5e9e9"/></linearGradient>
  <filter id="shadow" x="-25%" y="-20%" width="150%" height="150%"><feDropShadow dy="10" stdDeviation="12" flood-color="#5c7585" flood-opacity=".15"/></filter>
</defs>
<rect width="600" height="800" fill="url(#bg)"/>
<rect x="30" y="32" width="540" height="736" rx="26" fill="#fff" filter="url(#shadow)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#345363">
  <text x="66" y="107" font-size="43" font-weight="700">QC 驗貨報告</text>
  <text x="66" y="156" font-size="30" fill="#627788">照片整理／人工判讀</text>
</g>
<rect x="66" y="194" width="468" height="174" rx="22" fill="#eef4f6"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <text x="92" y="246" font-size="32" fill="#566e78">本批判定</text>
  <text x="92" y="332" font-size="64" font-weight="700" fill="#946c58">待確認</text>
  <path d="M386 245 L406 265 L455 213" stroke="#b98d74" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#375665">
  <text x="66" y="437" font-size="37" font-weight="600">抽樣 20 件</text>
  <text x="66" y="501" font-size="30" fill="#667a86">缺點分級</text>
</g>
<rect x="66" y="531" width="142" height="91" rx="17" fill="#edf3f3"/>
<rect x="229" y="531" width="142" height="91" rx="17" fill="#f9e9e9"/>
<rect x="392" y="531" width="142" height="91" rx="17" fill="#f7f0e4"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="29" text-anchor="middle">
  <text x="137" y="570" fill="#496c70">嚴重</text><text x="137" y="604" fill="#496c70" font-weight="700">0</text>
  <text x="300" y="570" fill="#875d66">主要</text><text x="300" y="604" fill="#875d66" font-weight="700">2</text>
  <text x="463" y="570" fill="#866d54">次要</text><text x="463" y="604" fill="#866d54" font-weight="700">1</text>
</g>
<path d="M66 667 H534" stroke="#dbe5e8" stroke-width="2"/>
<text x="66" y="718" fill="#71808b" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="29">示例資料 · 須人工確認</text>
</svg>